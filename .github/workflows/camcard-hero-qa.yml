name: CamCard hero visual QA

on:
  push:
    branches:
      - fix/camcard-hero-composition

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/camcard-hero-composition
          fetch-depth: 0

      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/server.log
          exit 1

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Capture hero states
        run: |
          cat > hero-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';

          const browser = await chromium.launch({headless:true});
          const report = {};

          for (const [label,width,height] of [['desktop',1440,1000],['mobile',390,844]]) {
            const page = await browser.newPage({viewport:{width,height}});
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));

            await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
            await page.waitForTimeout(700);
            await page.screenshot({path:`evidence/${label}-camcard-hero-top.png`, fullPage:false});
            await page.screenshot({path: label === 'desktop' ? 'evidence/desktop-1440.png' : 'evidence/mobile-390.png', fullPage:true});

            const topState = await page.evaluate(() => {
              const left = document.querySelector('.hand-from-left');
              const right = document.querySelector('.hand-from-right');
              const hero = document.querySelector('.hero-camcard');
              const title = document.querySelector('#hero-title');
              const stage = document.querySelector('[data-hands-stage]');
              return {
                rootClass: document.documentElement.className,
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                leftTransform: getComputedStyle(left).transform,
                rightTransform: getComputedStyle(right).transform,
                titleBottom: title.getBoundingClientRect().bottom,
                stageTop: stage.getBoundingClientRect().top,
                heroDisplay: getComputedStyle(hero).display
              };
            });

            await page.evaluate(() => window.scrollTo(0, 430));
            await page.waitForTimeout(350);
            await page.screenshot({path:`evidence/${label}-camcard-hero-scrolled.png`, fullPage:false});

            const scrolledState = await page.evaluate(() => ({
              scrollY: window.scrollY,
              leftTransform: getComputedStyle(document.querySelector('.hand-from-left')).transform,
              rightTransform: getComputedStyle(document.querySelector('.hand-from-right')).transform,
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth
            }));

            if (errors.length) throw new Error(`${label} runtime errors: ${errors.join(' | ')}`);
            if (topState.scrollWidth !== topState.clientWidth) throw new Error(`${label} overflow at top`);
            if (scrolledState.scrollWidth !== scrolledState.clientWidth) throw new Error(`${label} overflow after scroll`);
            if (topState.leftTransform === scrolledState.leftTransform) throw new Error(`${label} left hand did not move`);
            if (topState.rightTransform === scrolledState.rightTransform) throw new Error(`${label} right hand did not move`);
            if (!(topState.stageTop > topState.titleBottom)) throw new Error(`${label} hands stage is not below title`);

            report[label] = {errors,topState,scrolledState};
            await page.close();
          }

          writeFileSync('evidence/camcard-hero-qa.json', JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          EOF
          node hero-qa.mjs

      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/*camcard-hero*.png evidence/camcard-hero-qa.json evidence/desktop-1440.png evidence/mobile-390.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh CamCard-style hero QA evidence [skip ci]"
          git push origin HEAD:fix/camcard-hero-composition
