name: Exact GSAP hands QA

on:
  push:
    branches:
      - fix/exact-gsap-hands-direction

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exact-gsap-hands-direction
          fetch-depth: 0

      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/server.log
          exit 1

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Verify directions and scroll scrub
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));

          await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
          await page.waitForTimeout(700);

          const getState=()=>page.evaluate(()=>{
            const l=document.querySelector('.left-hand');
            const r=document.querySelector('.right-hand');
            const c=document.querySelector('.hands-container');
            return {
              scrollY:window.scrollY,
              leftSrc:l?.getAttribute('src'),
              rightSrc:r?.getAttribute('src'),
              leftTransform:getComputedStyle(l).transform,
              rightTransform:getComputedStyle(r).transform,
              containerTop:c.getBoundingClientRect().top,
              containerBottom:c.getBoundingClientRect().bottom,
              scrollWidth:document.documentElement.scrollWidth,
              clientWidth:document.documentElement.clientWidth
            };
          });

          const initial=await getState();
          await page.screenshot({path:'evidence/gsap-hands-start.png',fullPage:false});

          const targetY=await page.evaluate(()=>{
            const c=document.querySelector('.hands-container');
            return window.scrollY + c.getBoundingClientRect().top + c.getBoundingClientRect().height*0.78;
          });
          await page.evaluate(y=>window.scrollTo(0,y),targetY);
          await page.waitForTimeout(1200);

          const final=await getState();
          await page.screenshot({path:'evidence/gsap-hands-end.png',fullPage:false});

          if(errors.length) throw new Error(errors.join(' | '));
          if(initial.leftSrc!=='./assets/hand_left.png') throw new Error('left image mapping wrong');
          if(initial.rightSrc!=='./assets/hand_right.png') throw new Error('right image mapping wrong');
          if(initial.leftTransform===final.leftTransform) throw new Error('left hand did not move');
          if(initial.rightTransform===final.rightTransform) throw new Error('right hand did not move');
          if(initial.scrollWidth!==initial.clientWidth || final.scrollWidth!==final.clientWidth) throw new Error('horizontal overflow');

          const report={errors,initial,final};
          writeFileSync('evidence/gsap-hands-qa.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          EOF
          node qa.mjs

      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/gsap-hands-*.png evidence/gsap-hands-qa.json
          git commit -m "Add exact GSAP hands QA evidence [skip ci]" || exit 0
          git push origin HEAD:fix/exact-gsap-hands-direction
