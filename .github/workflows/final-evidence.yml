name: Refresh final submission evidence

on:
  push:
    branches:
      - chore/final-submission-pass

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/final-submission-pass
          fetch-depth: 0

      - name: Start static site
        run: |
          python3 -m http.server 4173 >/tmp/bca-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bca-server.log
          exit 1

      - name: Install Chromium for Playwright
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture final desktop and mobile
        run: |
          npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size="1440,1000" http://127.0.0.1:4173/ evidence/desktop-1440.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size="390,844" http://127.0.0.1:4173/ evidence/mobile-390.png

      - name: Commit refreshed evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/desktop-1440.png evidence/mobile-390.png
          if git diff --cached --quiet; then
            echo "Evidence already current."
          else
            git commit -m "Refresh final desktop and mobile evidence [skip ci]"
            git push origin HEAD:chore/final-submission-pass
          fi
