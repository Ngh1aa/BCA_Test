name: Hero hands always animate QA

on:
  push:
    branches:
      - fix/hero-hands-always-animate

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hero-hands-always-animate
      - run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          await page.emulateMedia({reducedMotion:'reduce'});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.waitForTimeout(900);

          const range=await page.evaluate(()=>{
            const trigger=ScrollTrigger.getAll().find(t=>t.trigger?.id==='camcard-hands-stage');
            if(!trigger) return null;
            return {start:trigger.start,end:trigger.end};
          });
          if(!range) throw new Error('hands ScrollTrigger not found');

          const get=()=>page.evaluate(()=>({
            rootClass:document.documentElement.className,
            left:getComputedStyle(document.querySelector('.camcard-hand--left')).transform,
            right:getComputedStyle(document.querySelector('.camcard-hand--right')).transform,
            badge:getComputedStyle(document.querySelector('#camcard-connect-badge')).opacity,
            overflow:[document.documentElement.scrollWidth,document.documentElement.clientWidth],
            gsap:!!window.gsap,
            scrollTrigger:!!window.ScrollTrigger
          }));

          await page.evaluate(y=>scrollTo(0,y),Math.max(0,range.start-40));
          await page.waitForTimeout(800);
          const start=await get();

          await page.evaluate(y=>scrollTo(0,y),(range.start+range.end)/2);
          await page.waitForTimeout(1200);
          const mid=await get();

          await page.evaluate(y=>scrollTo(0,y),range.end+40);
          await page.waitForTimeout(1200);
          const end=await get();

          if(errors.length) throw new Error(errors.join('|'));
          if(!start.gsap||!start.scrollTrigger) throw new Error('GSAP/ScrollTrigger missing');
          if(start.left===mid.left || mid.left===end.left) throw new Error('left hand not scrubbed');
          if(start.right===mid.right || mid.right===end.right) throw new Error('right hand not scrubbed');
          if(start.overflow[0]!==start.overflow[1] || end.overflow[0]!==end.overflow[1]) throw new Error('overflow');

          console.log(JSON.stringify({range,start,mid,end},null,2));
          await browser.close();
          EOF
          node qa.mjs
