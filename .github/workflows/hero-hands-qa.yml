name: Hero hands visual QA

on:
  push:
    branches:
      - feat/hero-hands-scroll

permissions:
  contents: write

jobs:
  hero-hands-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/hero-hands-scroll
          fetch-depth: 0

      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/hero-hands-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hero-hands-server.log
          exit 1

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Verify scroll scrub and capture evidence
        run: |
          cat > hero-hands-check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const report = { generated_at: new Date().toISOString(), default: [], figma_static: [], reduced_motion: null };
          const assert = (ok, message) => { if (!ok) throw new Error(message); };

          for (const [width,height] of [[1440,1000],[390,844]]) {
            const page = await browser.newPage({ viewport: { width, height } });
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(250);

            if (width <= 760) {
              await page.locator('[data-hands-stage]').scrollIntoViewIfNeeded();
              await page.waitForTimeout(100);
              await page.evaluate(() => window.scrollBy(0, -260));
            } else {
              await page.evaluate(() => window.scrollTo(0, 0));
            }
            await page.waitForTimeout(120);

            const before = await page.evaluate(() => {
              const left = document.querySelector('.hand-from-left');
              const right = document.querySelector('.hand-from-right');
              return {
                rootClass: document.documentElement.className,
                leftTransform: getComputedStyle(left).transform,
                rightTransform: getComputedStyle(right).transform,
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                images: [...document.querySelectorAll('.hero-hand')].map(img => ({
                  src: img.getAttribute('src'),
                  naturalWidth: img.naturalWidth,
                  naturalHeight: img.naturalHeight,
                  complete: img.complete
                }))
              };
            });

            if (width <= 760) {
              await page.evaluate(() => window.scrollBy(0, 360));
            } else {
              await page.evaluate(() => window.scrollTo(0, 420));
            }
            await page.waitForTimeout(180);

            const after = await page.evaluate(() => {
              const left = document.querySelector('.hand-from-left');
              const right = document.querySelector('.hand-from-right');
              const signal = document.querySelector('.hands-signal');
              return {
                leftTransform: getComputedStyle(left).transform,
                rightTransform: getComputedStyle(right).transform,
                signalOpacity: getComputedStyle(signal).opacity,
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth
              };
            });

            assert(errors.length === 0, `runtime errors at ${width}: ${errors.join(' | ')}`);
            assert(before.scrollWidth === before.clientWidth && after.scrollWidth === after.clientWidth, `horizontal overflow at ${width}`);
            assert(before.images.length === 2 && before.images.every(i => i.complete && i.naturalWidth > 0), `hero hand asset failed at ${width}`);
            assert(before.leftTransform !== after.leftTransform, `left hand did not respond to scroll at ${width}`);
            assert(before.rightTransform !== after.rightTransform, `right hand did not respond to scroll at ${width}`);

            report.default.push({ width, height, errors, before, after });

            await page.goto('http://127.0.0.1:4173/?figma=1', { waitUntil: 'networkidle' });
            await page.waitForTimeout(200);
            const staticData = await page.evaluate(() => ({
              rootClass: document.documentElement.className,
              leftTransform: getComputedStyle(document.querySelector('.hand-from-left')).transform,
              rightTransform: getComputedStyle(document.querySelector('.hand-from-right')).transform,
              signalOpacity: getComputedStyle(document.querySelector('.hands-signal')).opacity,
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth
            }));
            assert(staticData.rootClass.includes('figma-static'), `figma-static missing at ${width}`);
            assert(staticData.signalOpacity === '1', `signal not visible in figma mode at ${width}`);
            assert(staticData.scrollWidth === staticData.clientWidth, `figma mode overflow at ${width}`);
            report.figma_static.push({ width, height, ...staticData });

            const prefix = width === 1440 ? 'desktop' : 'mobile';
            await page.screenshot({ path: `evidence/${prefix}-1440-or-390.png`, fullPage: true });
            await page.locator('.hero').screenshot({ path: `evidence/${prefix}-hero-hands.png` });
            await page.close();
          }

          {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(150);
            const data = await page.evaluate(() => ({
              rootClass: document.documentElement.className,
              leftTransform: getComputedStyle(document.querySelector('.hand-from-left')).transform,
              rightTransform: getComputedStyle(document.querySelector('.hand-from-right')).transform,
              signalOpacity: getComputedStyle(document.querySelector('.hands-signal')).opacity
            }));
            assert(data.rootClass.includes('motion-reduced'), 'motion-reduced missing');
            assert(data.signalOpacity === '1', 'reduced-motion signal hidden');
            report.reduced_motion = data;
            await page.close();
          }

          writeFileSync('evidence/hero-hands-qa-report.json', JSON.stringify(report, null, 2) + '\n');
          await browser.close();
          console.log(JSON.stringify(report, null, 2));
          EOF

          node hero-hands-check.mjs

          base64 -w0 evidence/desktop-hero-hands.png > evidence/desktop-hero-hands.b64.txt
          base64 -w0 evidence/mobile-hero-hands.png > evidence/mobile-hero-hands.b64.txt

      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv evidence/desktop-1440-or-390.png evidence/desktop-1440.png
          mv evidence/mobile-1440-or-390.png evidence/mobile-390.png
          git add evidence/desktop-1440.png evidence/mobile-390.png evidence/desktop-hero-hands.png evidence/mobile-hero-hands.png evidence/desktop-hero-hands.b64.txt evidence/mobile-hero-hands.b64.txt evidence/hero-hands-qa-report.json
          if git diff --cached --quiet; then
            echo "Evidence already current."
          else
            git commit -m "Refresh hero hands visual QA evidence [skip ci]"
            git push origin HEAD:feat/hero-hands-scroll
          fi
