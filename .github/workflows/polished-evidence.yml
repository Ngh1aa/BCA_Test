name: Capture polished marketing visuals

on:
  push:
    branches:
      - feat/polished-marketing-visuals

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/polished-marketing-visuals
          fetch-depth: 0

      - name: Start static site
        run: |
          python3 -m http.server 4173 >/tmp/bca-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bca-server.log
          exit 1

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture final desktop and mobile
        run: |
          npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size="1440,1000" http://127.0.0.1:4173/ evidence/desktop-1440.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --full-page --viewport-size="390,844" http://127.0.0.1:4173/ evidence/mobile-390.png

      - name: Layout smoke check
        run: |
          cat > /tmp/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const results = [];
          for (const [width,height] of [[1440,1000],[390,844]]) {
            const page = await browser.newPage({viewport:{width,height}});
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
            const data = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
              images: [...document.images].map(i => ({src:i.getAttribute('src'), complete:i.complete, naturalWidth:i.naturalWidth})),
              benefits: [...document.querySelectorAll('.benefit-label span:last-child')].map(x=>x.textContent.trim()),
              heroVisual: !!document.querySelector('.hero-visual'),
              builderVisual: !!document.querySelector('.builder-visual')
            }));
            results.push({width,height,errors,...data});
            if (data.scrollWidth > data.clientWidth || errors.length || data.images.some(i=>!i.complete || i.naturalWidth===0)) process.exitCode = 1;
          }
          console.log(JSON.stringify(results,null,2));
          await browser.close();
          EOF
          npx --yes -p playwright@1.55.0 node /tmp/check.mjs

      - name: Commit refreshed evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/desktop-1440.png evidence/mobile-390.png
          if git diff --cached --quiet; then
            echo "Evidence already current."
          else
            git commit -m "Refresh polished desktop and mobile evidence [skip ci]"
            git push origin HEAD:feat/polished-marketing-visuals
          fi
