name: Visible hero scrub QA

on:
  push:
    branches:
      - fix/visible-hero-hands-scrub

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/visible-hero-hands-scrub
          fetch-depth: 0

      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/server.log
          exit 1

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Capture sticky scrub states
        run: |
          cat > scrub-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));

          await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
          await page.waitForTimeout(400);

          const getState = () => page.evaluate(() => {
            const stage=document.querySelector('[data-hands-stage]');
            const left=document.querySelector('.hand-from-left');
            const right=document.querySelector('.hand-from-right');
            const hero=document.querySelector('.hero-camcard');
            return {
              scrollY:window.scrollY,
              stageTop:stage.getBoundingClientRect().top,
              stagePosition:getComputedStyle(stage).position,
              stageHeight:stage.getBoundingClientRect().height,
              heroHeight:hero.getBoundingClientRect().height,
              leftTransform:getComputedStyle(left).transform,
              rightTransform:getComputedStyle(right).transform,
              overflow:[document.documentElement.scrollWidth,document.documentElement.clientWidth]
            };
          });

          const stageDocTop = await page.evaluate(() => {
            const stage=document.querySelector('[data-hands-stage]');
            return window.scrollY + stage.getBoundingClientRect().top;
          });

          const positions=[
            ['before',Math.max(0,stageDocTop-250)],
            ['mid',Math.max(0,stageDocTop+220)],
            ['meet',Math.max(0,stageDocTop+520)]
          ];
          const report={errors,states:{}};

          for (const [label,y] of positions){
            await page.evaluate(y=>window.scrollTo(0,y),y);
            await page.waitForTimeout(300);
            report.states[label]=await getState();
            await page.screenshot({path:`evidence/hero-scrub-${label}.png`,fullPage:false});
          }

          if(errors.length) throw new Error(errors.join(' | '));
          for(const [label,state] of Object.entries(report.states)){
            if(state.overflow[0]!==state.overflow[1]) throw new Error(`overflow at ${label}`);
          }
          if(report.states.before.leftTransform===report.states.mid.leftTransform) throw new Error('left hand did not move');
          if(report.states.mid.leftTransform===report.states.meet.leftTransform) throw new Error('left hand stopped moving');
          if(report.states.mid.stagePosition!=='sticky') throw new Error('stage is not sticky');

          writeFileSync('evidence/hero-scrub-qa.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          EOF
          node scrub-qa.mjs

      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/hero-scrub-*.png evidence/hero-scrub-qa.json
          git commit -m "Add visible hero scrub QA evidence [skip ci]" || exit 0
          git push origin HEAD:fix/visible-hero-hands-scrub
